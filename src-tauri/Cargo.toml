[package]
name = "cicada"
version = "0.2.0"
description = "知了：你只管说，它来整理"
authors = ["HenonBamboo"]
license = "AGPL-3.0-only"
repository = "https://github.com/HenonBamboo/Cicada"
edition = "2024"

[lib]
# _lib 后缀避免 Windows 上 lib 与 bin 重名，见 https://github.com/rust-lang/cargo/issues/8519
name = "cicada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
window-vibrancy = "0.8"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
# 模型调用：HTTP + 流式（rustls 避免依赖系统 OpenSSL）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
# API Key 只存 Windows 凭据管理器
keyring = { version = "3", features = ["windows-native"] }
# 备份：zip 打包 + 校验值；图片：data URL 解码
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
ring = "=0.17.14"
semver = "1"

[target.'cfg(windows)'.dependencies]
# 复用 Tauri 已锁定的 WebView2 接口，仅用于隐藏窗口的内存策略。
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

# 体积优化见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
