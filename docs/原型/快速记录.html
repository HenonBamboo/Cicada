<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知了 · 快速记录原型</title>
<link rel="icon" href="../../assets/logo/logo-small.svg">
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/theme.js"></script>
<style>
  body { overflow: hidden; background: linear-gradient(140deg, #CFE0DA 0%, #E7E3D3 50%, #D9D3E6 100%); }
  [data-theme="dark"] body, [data-theme="forest"] body, [data-theme="glass"] body { background: var(--wallpaper); }

  /* 背景里一个"别的软件"的窗口，表示在任何软件里都能唤起 */
  .other-app { position: fixed; left: 8%; top: 9%; width: 84%; height: 74%; border-radius: 10px; background: #FBFBFA; border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12); overflow: hidden; }
  [data-theme="dark"] .other-app, [data-theme="forest"] .other-app { background: #232627; border-color: rgba(255, 255, 255, 0.06); }
  .other-app .bar { height: 34px; border-bottom: 1px solid rgba(127, 127, 127, 0.15); display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .other-app .bar i { width: 10px; height: 10px; border-radius: 50%; background: rgba(127, 127, 127, 0.25); }
  .other-app .line { height: 10px; margin: 16px 24px 0; border-radius: 5px; background: rgba(127, 127, 127, 0.12); }

  .scrim { position: fixed; inset: 0; background: rgba(10, 20, 18, 0.12); opacity: 0; transition: opacity 0.18s; pointer-events: none; }
  .open .scrim { opacity: 1; pointer-events: auto; }

  /* 快速记录输入条 */
  .capture { position: fixed; left: 50%; top: 26%; width: min(640px, calc(100vw - 32px)); transform: translate(-50%, -8px) scale(0.98); opacity: 0; pointer-events: none; transition: opacity 0.16s var(--ease), transform 0.16s var(--ease); }
  .open .capture { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  .cap-box { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 10px 0 16px; border-radius: calc(18px * var(--rs)); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--pop-shadow); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
  [data-theme="glass"] .cap-box { background: rgba(255, 255, 255, 0.78); }
  .cap-box img { width: 22px; height: 22px; flex: none; }
  .cap-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 1.14rem; }
  .cap-box input::placeholder { color: var(--text-3); }
  .cap-hint { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 0 6px; font-size: 0.78rem; color: color-mix(in srgb, var(--text) 62%, transparent); }
  .kbd { display: inline-block; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface); font-family: var(--font-mono); font-size: 0.72rem; line-height: 16px; color: var(--text-2); }

  /* Windows 通知 */
  .toast { position: fixed; right: 16px; bottom: 16px; width: 340px; padding: 12px 14px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--pop-shadow); transform: translateX(24px); opacity: 0; transition: opacity 0.28s var(--ease), transform 0.28s var(--ease); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
  [data-theme="glass"] .toast { background: rgba(250, 252, 251, 0.95); }
  .toast.show { opacity: 1; transform: none; }
  .toast .hd { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: var(--text-2); }
  .toast .hd img { width: 16px; height: 16px; }
  .toast .hd .x { margin-left: auto; width: 22px; height: 22px; }
  .toast .tt { margin-top: 6px; font-weight: 500; font-size: 0.93rem; }
  .toast .bd { margin-top: 2px; font-size: 0.88rem; color: var(--text-2); }
  .toast .ops { display: flex; gap: 8px; margin-top: 10px; }
  .toast .ops .btn { flex: 1; justify-content: center; height: 30px; }

  .proto-ctl { position: fixed; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 0.82rem; color: var(--text-2); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
  .proto-ctl a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="other-app" aria-hidden="true">
  <div class="bar"><i></i><i></i><i></i></div>
  <div class="line" style="width: 40%"></div><div class="line" style="width: 70%"></div><div class="line" style="width: 62%"></div>
  <div class="line" style="width: 55%"></div><div class="line" style="width: 76%"></div><div class="line" style="width: 30%"></div>
</div>
<div class="scrim"></div>

<div class="capture" role="dialog" aria-label="快速记录">
  <div class="cap-box">
    <img src="../../assets/logo/logo-small.svg" alt="">
    <input id="capInput" placeholder="说一句，比如：周五前交报告，下午三点提醒我" autocomplete="off">
    <div class="seg" id="modeSeg"><button data-mode="task" class="on">任务</button><button data-mode="project">项目</button></div>
  </div>
  <div class="cap-hint">
    <span><span class="kbd">Enter</span> 记下 · <span class="kbd">Tab</span> 切换任务/项目 · <span class="kbd">Ctrl+V</span> 粘贴截图</span>
    <span><span class="kbd">Esc</span> 取消</span>
  </div>
</div>

<div class="toast" id="toast">
  <div class="hd"><img src="../../assets/logo/logo-small.svg" alt="">知了 · 现在<button class="icon-btn x" id="toastX" data-icon="x" aria-label="关闭通知"></button></div>
  <div class="tt" id="toastTitle"></div>
  <div class="bd" id="toastBody"></div>
  <div class="ops"><button class="btn" id="toastUndo" data-icon="undo"> 撤销</button><a class="btn" href="主界面.html" data-icon="window"> 打开知了</a></div>
</div>

<div class="proto-ctl">
  <span class="proto-badge">原型</span>
  <button class="btn" id="summon" data-icon="zap"> 模拟按下 Ctrl+Alt+Space</button>
  <a href="主界面.html">返回主界面</a>
  <span data-theme-switcher></span>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const input = $("capInput");
  let mode = "task", tt;

  function open() {
    document.body.classList.add("open");
    $("toast").classList.remove("show");
    setTimeout(() => input.focus(), 30);
  }
  function close() { document.body.classList.remove("open"); input.blur(); }
  function setMode(m) {
    mode = m;
    $("modeSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
    input.placeholder = m === "task" ? "说一句，比如：周五前交报告，下午三点提醒我" : "比如：给「知了」阶段 1 加一项：配置 ESLint";
  }

  function submit() {
    const v = input.value.trim();
    if (!v) return;
    input.value = "";
    close();
    setTimeout(() => {
      const remind = /三点|3\s*点/.test(v) ? " · 15:00 提醒" : "";
      $("toastTitle").textContent = "知了，记下了";
      $("toastBody").textContent = (mode === "task" ? "已添加任务：" : "已更新项目：") + v.replace(/[，,]?\s*(下午)?(三|3)\s*点提醒我/, "") + remind;
      $("toast").classList.add("show");
      clearTimeout(tt);
      tt = setTimeout(() => $("toast").classList.remove("show"), 6000);
    }, 900);
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submit(); }
    if (e.key === "Tab" && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) { e.preventDefault(); setMode(mode === "task" ? "project" : "task"); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
    if (e.altKey && e.code === "Space") { e.preventDefault(); open(); }
  });
  $("modeSeg").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) { setMode(b.dataset.mode); input.focus(); } });
  document.querySelector(".scrim").addEventListener("click", close);
  $("summon").addEventListener("click", open);
  $("toastX").addEventListener("click", () => $("toast").classList.remove("show"));
  $("toastUndo").addEventListener("click", () => { $("toastTitle").textContent = "已撤销"; $("toastBody").textContent = "刚才那件事已经撤回了。"; });

  open();
})();
</script>
</body>
</html>
