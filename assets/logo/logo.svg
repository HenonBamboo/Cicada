<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>知了</title>
  <defs>
    <path id="wl" d="M0 88 C-24 64 -42 0 -34 -46 C-28 -82 28 -82 34 -46 C42 0 24 64 0 88 Z"/>
    <path id="wr" d="M0 150 C-30 110 -50 0 -42 -80 C-36 -135 36 -135 42 -80 C50 0 30 110 0 150 Z"/>
  </defs>
  <g transform="translate(256 256) scale(1.04) translate(-214 -276)" stroke-linejoin="round">
